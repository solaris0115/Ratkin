<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>방패 방어도 계산기</title>
  <style>
    :root {
      --bg: #1a1a2e;
      --surface: #16213e;
      --surface2: #0f3460;
      --accent: #e94560;
      --text: #eaeaea;
      --text-muted: #8892a4;
      --border: #2a3a5c;
      --sharp: #ff6b8a;
      --blunt: #6bcfff;
      --heat: #ffb347;
      --good: #4caf7d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
    }

    .subtitle {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    #status {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-align: right;
    }

    #status.error { color: var(--accent); }
    #status.ok { color: var(--good); }

    .tables-wrapper {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
    }

    .table-section {
      flex: 1;
      min-width: 340px;
    }

    .table-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 10px;
      padding: 8px 12px;
      background: var(--surface2);
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border-radius: 8px;
      overflow: hidden;
    }

    thead tr {
      background: var(--surface2);
    }

    th {
      padding: 10px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      text-align: center;
      border-bottom: 2px solid var(--border);
    }

    th:first-child { text-align: left; }

    tbody tr {
      border-bottom: 1px solid var(--border);
      transition: background 0.15s;
    }

    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }

    td {
      padding: 10px 12px;
      vertical-align: middle;
    }

    td:first-child {
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text);
      white-space: nowrap;
    }

    .cell-values {
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-align: center;
    }

    .val-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      font-size: 0.8rem;
      cursor: default;
    }

    .val-row[data-armor]:hover {
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
    }

    .dmg-label {
      font-size: 0.68rem;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
      min-width: 28px;
      text-align: center;
    }

    .dmg-label.sharp { background: rgba(255,107,138,0.2); color: var(--sharp); }
    .dmg-label.blunt { background: rgba(107,207,255,0.2); color: var(--blunt); }
    .dmg-label.heat  { background: rgba(255,179,71,0.2);  color: var(--heat); }

    .dmg-val {
      font-weight: 600;
      font-size: 0.85rem;
      min-width: 44px;
      text-align: right;
    }

    .legend-box {
      display: flex;
      gap: 16px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .error-banner {
      background: rgba(233,69,96,0.15);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .error-banner code {
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
    }

    .wooden-note {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .quality-header {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .quality-badge {
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 10px;
      font-weight: 600;
      display: inline-block;
      margin-top: 2px;
    }

    .q-normal   { background: rgba(255,255,255,0.1); color: #ccc; }
    .q-master   { background: rgba(107,207,255,0.2); color: var(--blunt); }
    .q-legendary { background: rgba(255,165,0,0.2); color: var(--heat); }

    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-left: 2px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
    }

    .stuff-note {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* ─── 무기 AP 툴팁 ───────────────────────────── */
    #ap-tooltip {
      display: none;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      background: #1c1c30;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 8px 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      font-size: 0.72rem;
      min-width: 180px;
    }

    #ap-tooltip .tip-title {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-bottom: 5px;
      text-align: center;
    }

    #ap-tooltip table {
      width: 100%;
      background: transparent;
    }

    #ap-tooltip th {
      padding: 2px 6px;
      font-size: 0.65rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    #ap-tooltip td {
      padding: 3px 6px;
      font-size: 0.72rem;
      text-align: center;
    }

    #ap-tooltip td:first-child {
      text-align: left;
      font-weight: 600;
      font-size: 0.70rem;
      color: var(--text);
    }

    #ap-tooltip .ap-vs-ok   { color: var(--good); }
    #ap-tooltip .ap-vs-bad  { color: var(--accent); }
    #ap-tooltip .ap-vs-mid  { color: var(--heat); }
  </style>
</head>
<body>

<header>
  <div>
    <h1>방패 · 갑옷 방어도 계산기</h1>
    <div class="subtitle">XML 기반 자동 계산 · 1초마다 갱신</div>
  </div>
  <div id="status">로딩 중...</div>
</header>

<div id="error-area"></div>
<div id="ap-tooltip"></div>

<div class="section-title">방패</div>
<div id="tables" class="tables-wrapper"></div>

<div class="section-title" style="margin-top:32px;">갑옷 비교</div>
<div id="armor-table-wrap" class="tables-wrapper"></div>

<div class="legend-box">
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--sharp)"></div> 관통(Sharp)
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--blunt)"></div> 둔탁(Blunt)
  </div>
  <div class="legend-item">
    <div class="legend-dot" style="background:var(--heat)"></div> 열기(Heat)
  </div>
  <div class="legend-item" style="margin-left:auto; color:#666; font-size:0.72rem;">
    공식: (기본값 + 재질파워 × StuffBase) × 품질계수
  </div>
</div>

<script>
  // ─── 경로 설정 ─────────────────────────────────────────────────
  const PATHS = {
    shield       : '../Project/1.6/Defs/ThingsDefs/Apparel_Shield.xml',
    stats        : '../Project/1.6/Defs/Stats/Stats_ShieldDeflect.xml',
    stuff        : '../RimworldData/Core/Defs/ThingDefs_Items/Items_Resource_Stuff.xml',
    leather      : '../RimworldData/Core/Defs/ThingDefs_Items/Items_Resource_Stuff_Leather.xml',
    armorVarious : '../Project/1.6/Defs/ThingsDefs/Apparel_Various.xml',
    armorArmor   : '../Project/1.6/Defs/ThingsDefs/Apparel_Armor.xml',
    armorSpacer  : '../Project/1.6/Defs/ThingsDefs/Apparel_Spacer.xml',
  };


  // ─── 품질 계수 (Stats_ShieldDeflect.xml 에서 읽음, 아래가 폴백값) ─
  const QUALITY_FALLBACK = {
    normal    : 1.00,
    masterwork: 1.45,
    legendary : 1.80,
  };

  const QUALITY_LIST = [
    { key: 'normal',     label: '평범',  badgeClass: 'q-normal'    },
    { key: 'masterwork', label: '완벽',  badgeClass: 'q-master'    },
    { key: 'legendary',  label: '전설',  badgeClass: 'q-legendary' },
  ];

  const SHIELD_ORDER = [
    { defName: 'RK_WoodenShield', label: '우든 방패',  hasStuff: false },
    { defName: 'RK_HeavyShield',  label: '헤비 방패',  hasStuff: true  },
    { defName: 'RK_TowerShield',  label: '타워 방패',  hasStuff: true  },
  ];

  const STUFF_ORDER = [
    { defName: 'Steel',    label: '강철 (Steel)'    },
    { defName: 'Plasteel', label: '플라스틸 (Plasteel)' },
  ];

  // ─── 갑옷 목록 ─────────────────────────────────────────────────
  // stuffTier: 'normal' | 'premium' | 'fixed'
  const ARMOR_COMPARE_ORDER = [
    {
      defName      : 'RK_GaurdenUniform',
      label        : '정원사 유니폼',
      sourceKey    : 'armorVarious',
      stuffMultStat: 'StuffEffectMultiplierArmor',
      stuffTier    : 'leather',   // 가죽 재질
    },
    {
      defName      : 'RK_Plate',
      label        : '랫킨 판금 갑옷',
      sourceKey    : 'armorArmor',
      stuffMultStat: 'StuffEffectMultiplierArmor',
      stuffTier    : 'metal',     // 금속 재질
    },
    {
      defName      : 'RK_Apparel_SpaceArmor',
      label        : '랫킨 우주 갑옷',
      sourceKey    : 'armorSpacer',
      stuffMultStat: null,
      stuffTier    : 'fixed',     // 재질 없음
    },
  ];

  // 소재 등급별 매핑: normal = 강철+일반가죽, premium = 플라스틸+트럼보가죽
  const ARMOR_TIER_SETS = [
    { label: '평범 소재  (강철 · 일반가죽)', metalDef: 'Steel',    leatherDef: 'Leather_Plain'   },
    { label: '고급 소재  (플라스틸 · 트럼보)', metalDef: 'Plasteel', leatherDef: 'Leather_Thrumbo' },
  ];

  // LeatherBase 기본값 폴백 (Leather_Plain은 부모 상속만)
  const LEATHER_BASE_FALLBACK = {
    StuffPower_Armor_Sharp : 0.81,
    StuffPower_Armor_Blunt : 0.24,
    StuffPower_Armor_Heat  : 1.50,
  };

  // ─── 유틸: XML 노드 단순 텍스트 파서 ────────────────────────────
  function getStatVal(thingDef, statName) {
    // statBases > statName 직접 조회
    const sb = thingDef.querySelector('statBases');
    if (!sb) return 0;
    const el = sb.querySelector(statName);
    return el ? parseFloat(el.textContent.trim()) : 0;
  }

  function getStuffStat(thingDef, statName) {
    const sb = thingDef.querySelector('statBases');
    if (!sb) return 0;
    const el = sb.querySelector(statName);
    return el ? parseFloat(el.textContent.trim()) : 0;
  }

  function findDefByName(doc, tagName, defNameValue) {
    const all = doc.querySelectorAll(tagName);
    for (const el of all) {
      const dn = el.querySelector(':scope > defName');
      if (dn && dn.textContent.trim() === defNameValue) return el;
    }
    return null;
  }

  // ─── 계산 ──────────────────────────────────────────────────────
  function calcArmor(base, stuffPower, stuffBase, qualityFactor) {
    const raw = (base + stuffPower * stuffBase) * qualityFactor;
    return Math.min(raw, 2.0); // maxValue cap
  }

  function pct(v) {
    return (v * 100).toFixed(1) + '%';
  }

  // ─── 렌더링 ────────────────────────────────────────────────────
  function buildTable(stuffDef, stuffLabel, shields, qualityFactors) {
    const sp = {
      sharp: getStuffStat(stuffDef, 'StuffPower_Armor_Sharp'),
      blunt: getStuffStat(stuffDef, 'StuffPower_Armor_Blunt'),
      heat : getStuffStat(stuffDef, 'StuffPower_Armor_Heat'),
    };

    const section = document.createElement('div');
    section.className = 'table-section';

    const title = document.createElement('div');
    title.className = 'table-title';
    title.textContent = stuffLabel;
    section.appendChild(title);

    const table = document.createElement('table');

    // thead
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    const th0 = document.createElement('th');
    th0.textContent = '방패';
    hr.appendChild(th0);

    for (const q of QUALITY_LIST) {
      const th = document.createElement('th');
      th.innerHTML = `<div class="quality-header">
        ${q.label}
        <span class="quality-badge ${q.badgeClass}">&times;${qualityFactors[q.key].toFixed(2)}</span>
      </div>`;
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    table.appendChild(thead);

    // tbody
    const tbody = document.createElement('tbody');

    for (const shieldInfo of SHIELD_ORDER) {
      const shield = shields[shieldInfo.defName];
      if (!shield) continue;

      const tr = document.createElement('tr');

      const tdLabel = document.createElement('td');
      tdLabel.innerHTML = shieldInfo.label;
      if (!shieldInfo.hasStuff) {
        tdLabel.innerHTML += '<div class="wooden-note">재질 고정</div>';
      }
      tr.appendChild(tdLabel);

      for (const q of QUALITY_LIST) {
        const qf = qualityFactors[q.key];
        const effectiveStuffBase = shieldInfo.hasStuff ? shield.stuffBase : 0;
        const effectiveStuffPower = shieldInfo.hasStuff ? sp : { sharp: 0, blunt: 0, heat: 0 };

        const sharpVal = calcArmor(shield.sharp, effectiveStuffPower.sharp, effectiveStuffBase, qf);
        const bluntVal = calcArmor(shield.blunt, effectiveStuffPower.blunt, effectiveStuffBase, qf);
        const heatVal  = calcArmor(shield.heat,  effectiveStuffPower.heat,  effectiveStuffBase, qf);

        const td = document.createElement('td');
        td.innerHTML = makeArmorCell(sharpVal, bluntVal, heatVal);
        tr.appendChild(td);
      }

      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    section.appendChild(table);
    return section;
  }

  function makeArmorCell(sharpVal, bluntVal, heatVal) {
    return `
      <div class="cell-values">
        <div class="val-row" data-armor="${sharpVal.toFixed(4)}" data-dmg="sharp">
          <span class="dmg-label sharp">관통</span>
          <span class="dmg-val">${pct(sharpVal)}</span>
        </div>
        <div class="val-row" data-armor="${bluntVal.toFixed(4)}" data-dmg="blunt">
          <span class="dmg-label blunt">둔탁</span>
          <span class="dmg-val">${pct(bluntVal)}</span>
        </div>
        <div class="val-row" data-armor="${heatVal.toFixed(4)}" data-dmg="heat">
          <span class="dmg-label heat">열기</span>
          <span class="dmg-val">${pct(heatVal)}</span>
        </div>
      </div>`;
  }

  // ─── 갑옷 비교 테이블 빌더 ─────────────────────────────────────
  // tierSet: { label, metalDef, leatherDef }  + stuffDocs
  function buildArmorCompareTable(armors, qualityFactors, tierSet, metalDoc, leatherDoc) {
    const getStuffPower = (doc, defName, statName, fallback = 0) => {
      const def = findDefByName(doc, 'ThingDef', defName);
      if (!def) return fallback;
      const v = getStuffStat(def, statName);
      return v !== 0 ? v : fallback;
    };

    // 금속 파워
    const metalSP = {
      sharp: getStuffPower(metalDoc, tierSet.metalDef, 'StuffPower_Armor_Sharp'),
      blunt: getStuffPower(metalDoc, tierSet.metalDef, 'StuffPower_Armor_Blunt'),
      heat : getStuffPower(metalDoc, tierSet.metalDef, 'StuffPower_Armor_Heat'),
    };
    // 가죽 파워 (LeatherBase 폴백)
    const leatherSP = {
      sharp: getStuffPower(leatherDoc, tierSet.leatherDef, 'StuffPower_Armor_Sharp', LEATHER_BASE_FALLBACK.StuffPower_Armor_Sharp),
      blunt: getStuffPower(leatherDoc, tierSet.leatherDef, 'StuffPower_Armor_Blunt', LEATHER_BASE_FALLBACK.StuffPower_Armor_Blunt),
      heat : getStuffPower(leatherDoc, tierSet.leatherDef, 'StuffPower_Armor_Heat',  LEATHER_BASE_FALLBACK.StuffPower_Armor_Heat),
    };

    const section = document.createElement('div');
    section.className = 'table-section';

    const title = document.createElement('div');
    title.className = 'table-title';
    title.textContent = tierSet.label;
    section.appendChild(title);

    const table = document.createElement('table');
    const thead = document.createElement('thead');
    const hr = document.createElement('tr');
    const th0 = document.createElement('th');
    th0.textContent = '갑옷';
    hr.appendChild(th0);
    for (const q of QUALITY_LIST) {
      const th = document.createElement('th');
      th.innerHTML = `<div class="quality-header">
        ${q.label}
        <span class="quality-badge ${q.badgeClass}">&times;${qualityFactors[q.key].toFixed(2)}</span>
      </div>`;
      hr.appendChild(th);
    }
    thead.appendChild(hr);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (const armorInfo of armors) {
      const armor = armorInfo.def;
      if (!armor) continue;

      const isFixed   = armorInfo.stuffTier === 'fixed';
      const isLeather = armorInfo.stuffTier === 'leather';
      const isMetal   = armorInfo.stuffTier === 'metal';

      const stuffBase = (!isFixed && armorInfo.stuffMultStat)
        ? getStatVal(armor, armorInfo.stuffMultStat) : 0;
      const sp = isLeather ? leatherSP : isMetal ? metalSP : { sharp: 0, blunt: 0, heat: 0 };

      const tr = document.createElement('tr');
      const tdLabel = document.createElement('td');
      let sub = '';
      if (isFixed)   sub = '고정 재료';
      else if (isLeather) sub = tierSet.leatherDef === 'Leather_Plain' ? '일반가죽' : '트럼보가죽';
      else if (isMetal)   sub = tierSet.metalDef;
      tdLabel.innerHTML = armorInfo.label +
        (sub ? `<div class="stuff-note">${sub}</div>` : '');
      tr.appendChild(tdLabel);

      for (const q of QUALITY_LIST) {
        const qf = qualityFactors[q.key];
        const sharpVal = calcArmor(getStatVal(armor, 'ArmorRating_Sharp'), sp.sharp, stuffBase, qf);
        const bluntVal = calcArmor(getStatVal(armor, 'ArmorRating_Blunt'), sp.blunt, stuffBase, qf);
        const heatVal  = calcArmor(getStatVal(armor, 'ArmorRating_Heat'),  sp.heat,  stuffBase, qf);

        const td = document.createElement('td');
        td.innerHTML = makeArmorCell(sharpVal, bluntVal, heatVal);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }

    table.appendChild(tbody);
    section.appendChild(table);
    return section;
  }

  // ─── 메인 로드 ─────────────────────────────────────────────────
  async function load() {
    const statusEl      = document.getElementById('status');
    const tablesEl      = document.getElementById('tables');
    const armorWrap     = document.getElementById('armor-table-wrap');
    const errorEl       = document.getElementById('error-area');

    statusEl.textContent = '로딩 중...';
    statusEl.className = '';
    tablesEl.innerHTML  = '';
    armorWrap.innerHTML = '';
    errorEl.innerHTML   = '';

    try {
      const fetchXml = async (url) => {
        const r = await fetch(url + '?t=' + Date.now(), { cache: 'no-store' });
        if (!r.ok) throw new Error(`HTTP ${r.status}: ${url}`);
        const text = await r.text();
        const doc = new DOMParser().parseFromString(text, 'text/xml');
        const parseErr = doc.querySelector('parsererror');
        if (parseErr) throw new Error('XML 파싱 실패: ' + url);
        return doc;
      };

      const [shieldDoc, statsDoc, stuffDoc, leatherDoc, variousDoc, armorDoc, spacerDoc] = await Promise.all([
        fetchXml(PATHS.shield),
        fetchXml(PATHS.stats),
        fetchXml(PATHS.stuff),
        fetchXml(PATHS.leather),
        fetchXml(PATHS.armorVarious),
        fetchXml(PATHS.armorArmor),
        fetchXml(PATHS.armorSpacer),
      ]);

      // 품질 계수 파싱
      const qf = { ...QUALITY_FALLBACK };
      const qPart = statsDoc.querySelector('StatPart_Quality');
      if (qPart) {
        const r = (name, fallback) => {
          const el = qPart.querySelector(name);
          return el ? parseFloat(el.textContent.trim()) : fallback;
        };
        qf.normal     = r('factorNormal',     QUALITY_FALLBACK.normal);
        qf.masterwork = r('factorMasterwork',  QUALITY_FALLBACK.masterwork);
        qf.legendary  = r('factorLegendary',   QUALITY_FALLBACK.legendary);
      }

      // 방패 데이터 파싱
      const shields = {};
      for (const si of SHIELD_ORDER) {
        const def = findDefByName(shieldDoc, 'ThingDef', si.defName);
        if (def) {
          shields[si.defName] = {
            stuffBase : getStatVal(def, 'RK_Stat_ShieldStuffBase'),
            sharp     : getStatVal(def, 'RK_Stat_Shield_Sharp'),
            blunt     : getStatVal(def, 'RK_Stat_Shield_Blunt'),
            heat      : getStatVal(def, 'RK_Stat_Shield_Heat'),
          };
        }
      }

      // 방패 재질별 테이블 렌더링
      for (const stuffInfo of STUFF_ORDER) {
        const stuffDef = findDefByName(stuffDoc, 'ThingDef', stuffInfo.defName);
        if (stuffDef) {
          tablesEl.appendChild(buildTable(stuffDef, stuffInfo.label, shields, qf));
        }
      }

      // 갑옷 파싱 및 렌더링
      const sourceDocMap = {
        armorVarious : variousDoc,
        armorArmor   : armorDoc,
        armorSpacer  : spacerDoc,
      };
      const armorItems = ARMOR_COMPARE_ORDER.map(info => ({
        ...info,
        def: findDefByName(sourceDocMap[info.sourceKey], 'ThingDef', info.defName),
      }));
      for (const tierSet of ARMOR_TIER_SETS) {
        armorWrap.appendChild(buildArmorCompareTable(armorItems, qf, tierSet, stuffDoc, leatherDoc));
      }

      const now = new Date().toLocaleTimeString('ko-KR');
      statusEl.textContent = `마지막 갱신: ${now}`;
      statusEl.className = 'ok';

      attachTooltipEvents();

    } catch (err) {
      statusEl.textContent = '오류';
      statusEl.className = 'error';
      errorEl.innerHTML = `
        <div class="error-banner">
          <strong>XML 로딩 실패:</strong> ${err.message}<br><br>
          브라우저 보안 정책으로 로컬 파일 접근이 차단될 수 있습니다.<br>
          아래 명령어로 로컬 서버를 실행하세요:<br><br>
          <code>cd D:\\GitProject\\Ratkin</code><br>
          <code>python -m http.server 8080</code><br><br>
          그 후 <code>http://localhost:8080/TempData/shield_calc.html</code> 접속
        </div>`;
    }
  }

  // ─── 무기 AP 데이터 (데미지 타입별 분리) ──────────────────────
  // 원거리 AP 품질계수 (RangedWeapon_ArmorPenetrationMultiplier): Normal=1.0, Legendary=1.5
  // 근접 AP 품질계수 (MeleeWeapon_DamageMultiplier): Normal=1.0, Legendary=1.65
  // 근접 AP: explicit → 고정 / else → power × stuffMult × qualityFactor × 0.015
  const RQ = { normal: 1.0, legendary: 1.5 };
  const MQ = { normal: 1.0, legendary: 1.65 };

  function rangedAP(baseAP, qf) { return baseAP * qf; }
  function meleeAP(power, stuffMult, qf) { return power * stuffMult * qf * 0.015; }

  const WEAPONS_BY_TYPE = {
    sharp: [
      // ── 원거리 (AP × RangedWeapon_ArmorPenetrationMultiplier) ──
      { name: '리볼버',           apNormal: rangedAP(0.18,  RQ.normal), apLegendary: rangedAP(0.18,  RQ.legendary), note: '원거리' },
      { name: '기관단총',         apNormal: rangedAP(0.09,  RQ.normal), apLegendary: rangedAP(0.09,  RQ.legendary), note: '원거리' },
      { name: '차지랜스',         apNormal: rangedAP(0.45,  RQ.normal), apLegendary: rangedAP(0.45,  RQ.legendary), note: '원거리' },
      { name: '센티피드 블라스터', apNormal: rangedAP(0.225, RQ.normal), apLegendary: rangedAP(0.225, RQ.legendary), note: '원거리' },
      // ── 근접 ──
      { name: '스피어 (강철)', apNormal: 0.50 * MQ.normal, apLegendary: 0.50 * MQ.legendary },
      { name: '장검 (강철)', apNormal: meleeAP(23, 1.0, MQ.normal), apLegendary: meleeAP(23, 1.0, MQ.legendary) },
    ],
    blunt: [
      { name: '워해머 (우라늄)', apNormal: meleeAP(20, 1.5, MQ.normal), apLegendary: meleeAP(20, 1.5, MQ.legendary) },
      { name: '제우스해머', apNormal: meleeAP(31, 1.0, MQ.normal), apLegendary: meleeAP(31, 1.0, MQ.legendary) },
    ],
    heat: [
      { name: '빔 그레이저', apNormal: rangedAP(0.50, RQ.normal), apLegendary: rangedAP(0.50, RQ.legendary), note: '원거리' },
      { name: '빔 리피터', apNormal: rangedAP(0.50, RQ.normal), apLegendary: rangedAP(0.50, RQ.legendary), note: '원거리' },
      { name: '플라즈마소드 (화염)', apNormal: 0.0, apLegendary: 0.0, note: '부가 데미지' },
      { name: '스코쳐 (화염)', apNormal: 0.0, apLegendary: 0.0, note: '화염 분사' },
      { name: '일반 화염 (착화)', apNormal: 0.0, apLegendary: 0.0, note: '몸에 붙은 불' },
    ],
  };

  // ─── 툴팁 ──────────────────────────────────────────────────────
  const tooltip = document.getElementById('ap-tooltip');
  let tipActive = false;

  function showTooltip(armorVal, dmgType, e) {
    const weapons = WEAPONS_BY_TYPE[dmgType] || [];
    if (!weapons.length) return;

    const typeLabel = { sharp: '관통', blunt: '둔탁', heat: '열기' }[dmgType] || dmgType;
    let html = `<div class="tip-title">${typeLabel} 방어도 ${pct(armorVal)} vs 무기 AP</div>`;
    html += `<table><thead><tr><th>무기</th><th>평범</th><th>전설</th></tr></thead><tbody>`;
    for (const w of weapons) {
      html += `<tr><td>${w.name}`;
      if (w.note) html += `<div style="font-size:0.58rem;color:#666;">${w.note}</div>`;
      html += `</td>`;
      for (const ap of [w.apNormal, w.apLegendary]) {
        const deflect = Math.max(armorVal - ap, 0);
        const cls = deflect > 0.3 ? 'ap-vs-ok' : deflect < 0.05 ? 'ap-vs-bad' : 'ap-vs-mid';
        html += `<td class="${cls}">${(ap * 100).toFixed(1)}% (${pct(deflect)})</td>`;
      }
      html += `</tr>`;
    }
    html += `</tbody></table>`;
    tooltip.innerHTML = html;
    tooltip.style.display = 'block';
    positionTooltip(e);
    tipActive = true;
  }

  function positionTooltip(e) {
    const pad = 14;
    let x = e.clientX + pad;
    let y = e.clientY + pad;
    const rect = tooltip.getBoundingClientRect();
    if (x + rect.width > window.innerWidth)  x = e.clientX - rect.width - pad;
    if (y + rect.height > window.innerHeight) y = e.clientY - rect.height - pad;
    tooltip.style.left = x + 'px';
    tooltip.style.top  = y + 'px';
  }

  function hideTooltip() {
    tooltip.style.display = 'none';
    tipActive = false;
  }

  document.addEventListener('mousemove', (e) => {
    if (tipActive) positionTooltip(e);
  });

  function attachTooltipEvents() {
    document.querySelectorAll('[data-armor]').forEach(el => {
      el.addEventListener('mouseenter', (e) => {
        const val = parseFloat(el.dataset.armor);
        const dmgType = el.dataset.dmg || 'sharp';
        if (!isNaN(val)) showTooltip(val, dmgType, e);
      });
      el.addEventListener('mouseleave', hideTooltip);
    });
  }

  // ─── 폴링: 1초마다 XML 읽고 변경 시에만 재렌더링 ────────────────
  let lastSnapshot = '';

  async function loadWithDiff() {
    const statusEl = document.getElementById('status');
    try {
      const texts = await Promise.all(
        Object.values(PATHS).map(url =>
          fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text())
        )
      );
      const snapshot = texts.join('||');
      if (snapshot === lastSnapshot) return; // 변경 없으면 스킵
      lastSnapshot = snapshot;
      await load();
    } catch {
      // load() 내부에서 오류 처리
    }
  }

  load().then(() => {
    // 최초 로드 후 스냅샷 세팅
    Promise.all(
      Object.values(PATHS).map(url =>
        fetch(url + '?t=' + Date.now(), { cache: 'no-store' }).then(r => r.text())
      )
    ).then(texts => { lastSnapshot = texts.join('||'); });
  });

  setInterval(loadWithDiff, 1000);
</script>
</body>
